[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "farepy"
version = "0.1.5"
description = "Multi-source flight search with normalized results, caching, and batch support"
license = "MIT"
authors = [{ name = "Thor Whalen" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/thorwhalen/farepy"
Repository = "https://github.com/thorwhalen/farepy"
Issues = "https://github.com/thorwhalen/farepy/issues"

[project.optional-dependencies]
google_flights = ["fast-flights"]
ryanair = ["ryanair-py"]
kayak = ["playwright"]
all = ["fast-flights", "ryanair-py", "playwright"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "6.0"
# The package dir is listed explicitly: wads CI runs `pytest --doctest-modules`
# with no path argument, so collection is driven entirely by `testpaths`.
testpaths = ["farepy"]
# Mirrors the flags CI passes via `-o doctest_optionflags=...`, so a local run
# behaves identically to the CI run.
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL"]

[tool.wads.ci]
installer = "uv"

[tool.wads.ci.testing]
python_versions = ["3.10", "3.12"]
coverage_enabled = false
test_on_windows = false
